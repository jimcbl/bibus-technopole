[package]
name = "bibus-technopole"
version = "0.2.1"
edition = "2021"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
prost = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
tao = "0.37"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
